<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Revalidate on every load so a teacher who replaces the folder never serves stale JS. -->
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Harvest Hollow</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌰</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #fallback {
      display: none; position: fixed; inset: 0; margin: auto; max-width: 30rem; height: max-content;
      padding: 1.5rem; color: #f6e7c8; font-family: "Trebuchet MS", Verdana, sans-serif; text-align: center;
    }
    #fallback h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    #fallback p { font-size: 1.05rem; line-height: 1.5; opacity: .9; }
    #fallback code { background: rgba(255,255,255,.12); padding: .1em .35em; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="fallback">
    <h1>🌰 Oops!</h1>
    <p id="fallback-msg">The game could not start. Please refresh the page.</p>
  </div>

  <script>
    // Friendly fallback instead of a black screen. Two common classroom failures:
    // opening the file directly (file://) and a script that fails to load.
    (function () {
      var fb = document.getElementById('fallback');
      var msg = document.getElementById('fallback-msg');
      function show(text) { if (fb) { fb.style.display = 'block'; if (text && msg) msg.textContent = text; } }
      if (location.protocol === 'file:') {
        show('Open this game from a web address (http://…), not as a file on the computer.');
      }
      window.addEventListener('error', function (e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          show('A game file did not load. Try a hard refresh, or ask your teacher.');
        }
      }, true);
      // If nothing has drawn after a few seconds, assume a startup error.
      setTimeout(function () {
        if (!document.querySelector('#game canvas')) show();
      }, 6000);
      window.HH_ok = function () { if (fb) fb.style.display = 'none'; };
    })();
  </script>

  <script src="lib/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
